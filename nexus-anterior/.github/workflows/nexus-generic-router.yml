name: Nexus generic capability router lab

on:
  pull_request:
    paths:
      - 'nexus/capability_router.py'
      - 'nexus/tests/test_generic_capability_router.py'
      - 'nexus/ui/**'
      - 'nexus/tests/folha_*'
      - 'nexus/integrity.json'
      - 'server.js'
      - 'package.json'
      - '.github/workflows/nexus-generic-router.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  routing:
    name: Pure registry and fail-closed proposals (Windows and Linux)
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned Nexus tests
        run: python -m pip install -r nexus/requirements-test.txt
      - name: Test N-adapter proposals and refusals
        run: python -m pytest -q -o pythonpath=. nexus/tests/test_generic_capability_router.py
      - name: Check Folha JavaScript syntax
        run: node --check nexus/ui/app.js
      - name: Install pinned browser test dependency
        run: npm install --ignore-scripts --package-lock=false
      - name: Test blank sheet, product preparation, approvals and Host transport
        run: npm test
      - name: Real Chrome - blank sheet and product preparation
        run: npm run test:browser
      - name: Preserve Folha browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: folha-browser-${{ matrix.os }}
          path: folha-browser-evidence/
          if-no-files-found: error
          retention-days: 14
