name: Windows runner safety
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, fix/windows-runner-safe-invocation]
permissions:
  contents: read
jobs:
  argv-safety:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate PowerShell literal argv, locks and exit codes
        run: python -m unittest discover -s tests -p test_runner_windows.py -v
